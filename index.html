<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matek Feladatsor – 1. osztály</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFD93D;
    --orange: #FF6B35;
    --blue: #4CC9F0;
    --teal: #4ECDC4;
    --pink: #FF6B9D;
    --green: #06D6A0;
    --purple: #9B5DE5;
    --red: #EF233C;
    --bg: #F0F4FF;
    --card: #ffffff;
    --dark: #1A1A2E;
    --text-muted: #888;
    --border: #E8E8E8;
    --task-bg: #F8F9FF;
    --task-border: #EBEBF5;
    --label-color: #bbb;
    --divider: #EEE;
    --word1-bg: #FFF8EC;
    --word2-bg: #F0FFF8;
    --word3-bg: #F5F0FF;
    --word4-bg: #FFF0F5;
    --icon-green-bg: #EDFCF5;
    --icon-pink-bg: #FFF0F5;
    --icon-purple-bg: #F3EEFF;
    --icon-yellow-bg: #FFFBEA;
    --shadow: rgba(0,0,0,0.06);
  }

  [data-theme="dark"] {
    --bg: #0F1117;
    --card: #1A1D2E;
    --dark: #E8EAFF;
    --text-muted: #7B7F9E;
    --border: #2E3150;
    --task-bg: #12152A;
    --task-border: #2A2D4A;
    --label-color: #5A5E7E;
    --divider: #2A2D4A;
    --word1-bg: #1E1A0D;
    --word2-bg: #0D1E18;
    --word3-bg: #160D2E;
    --word4-bg: #1E0D18;
    --icon-green-bg: #0D2018;
    --icon-pink-bg: #2E0D18;
    --icon-purple-bg: #180D2E;
    --icon-yellow-bg: #2E280D;
    --shadow: rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--dark);
    min-height: 100vh;
    padding: 24px 16px 48px;
    transition: background 0.3s, color 0.3s;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    margin-bottom: 28px;
    position: relative;
  }

  .dark-toggle {
    position: absolute;
    right: 0; top: 0;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 50px;
    padding: 8px 14px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 10px var(--shadow);
    color: var(--dark);
  }
  .dark-toggle:hover { transform: scale(1.05); }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border-radius: 40px;
    padding: 6px 18px;
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--purple);
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 2px 12px rgba(155,93,229,0.15);
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Fredoka One', sans-serif;
    font-size: 3rem;
    background: linear-gradient(135deg, var(--orange) 0%, var(--pink) 50%, var(--purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }

  .subtitle {
    font-size: 1rem;
    color: var(--text-muted);
    font-weight: 700;
    margin-top: 6px;
  }

  /* ===== INFO BAR ===== */
  .info-bar {
    display: flex;
    gap: 12px;
    max-width: 860px;
    margin: 0 auto 16px;
    flex-wrap: wrap;
  }

  .info-field {
    flex: 1;
    min-width: 160px;
    background: var(--card);
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: 0 2px 10px var(--shadow);
  }

  .info-field label {
    display: block;
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--label-color);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .info-field input {
    width: 100%;
    border: none;
    border-bottom: 2.5px solid var(--border);
    outline: none;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--dark);
    background: transparent;
    padding-bottom: 2px;
    transition: border-color 0.2s;
  }
  .info-field input:focus { border-color: var(--purple); }

  /* ===== SETTINGS PANEL ===== */
  .settings-panel {
    max-width: 860px;
    margin: 0 auto 20px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 2px 10px var(--shadow);
    overflow: hidden;
  }

  .settings-toggle {
    width: 100%;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: none;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--text-muted);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .settings-toggle:hover { color: var(--purple); }

  .settings-body {
    display: none;
    padding: 0 20px 16px;
    border-top: 2px dashed var(--divider);
  }
  .settings-body.open { display: block; }

  .settings-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
    padding-top: 14px;
  }

  .settings-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .settings-field label {
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--label-color);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .settings-field input[type="number"] {
    width: 80px;
    padding: 8px 10px;
    border: 2.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    color: var(--dark);
    background: var(--task-bg);
    outline: none;
    transition: border-color 0.2s;
  }
  .settings-field input[type="number"]:focus { border-color: var(--purple); }

  .settings-checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border: 2.5px solid var(--border);
    border-radius: 10px;
    background: var(--task-bg);
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--dark);
    transition: all 0.2s;
    user-select: none;
  }
  .settings-checkbox input { width: 16px; height: 16px; accent-color: var(--purple); cursor: pointer; }
  .settings-checkbox:hover { border-color: var(--purple); }

  .settings-apply {
    margin-left: auto;
    padding: 8px 20px;
    background: linear-gradient(135deg, var(--purple), #C77DFF);
    color: white;
    border: none;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 3px 12px rgba(155,93,229,0.35);
  }
  .settings-apply:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(155,93,229,0.45); }

  /* ===== MAIN LAYOUT ===== */
  .main {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ===== CARDS ===== */
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 24px 28px;
    box-shadow: 0 4px 20px var(--shadow);
    position: relative;
    overflow: hidden;
    animation: fadeIn 0.35s ease;
  }

  .card-accent {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    border-radius: 20px 20px 0 0;
  }
  .card-accent.green  { background: linear-gradient(90deg, var(--green), var(--teal)); }
  .card-accent.pink   { background: linear-gradient(90deg, var(--pink), var(--orange)); }
  .card-accent.purple { background: linear-gradient(90deg, var(--purple), var(--blue)); }
  .card-accent.yellow { background: linear-gradient(90deg, var(--yellow), var(--orange)); }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .card-title {
    font-family: 'Fredoka One', sans-serif;
    font-size: 1.25rem;
    color: var(--dark);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .card-title .icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }
  .icon.green  { background: var(--icon-green-bg); }
  .icon.pink   { background: var(--icon-pink-bg); }
  .icon.purple { background: var(--icon-purple-bg); }
  .icon.yellow { background: var(--icon-yellow-bg); }

  .card-score {
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 50px;
    background: var(--task-bg);
    border: 2px solid var(--task-border);
    min-width: 36px;
    text-align: center;
  }
  .card-score.all-correct { color: var(--green); border-color: var(--green); background: var(--icon-green-bg); }
  .card-score.some-wrong  { color: var(--red);   border-color: var(--red);   background: #FFF0F2; }
  [data-theme="dark"] .card-score.some-wrong { background: #2E0D12; }

  .btn-sm {
    padding: 6px 14px;
    border-radius: 50px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-size: 0.8rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn-sm:active { transform: scale(0.94); }

  .btn-sm-check {
    background: linear-gradient(135deg, var(--green), var(--teal));
    color: white;
    box-shadow: 0 2px 10px rgba(6,214,160,0.3);
  }
  .btn-sm-check:hover { box-shadow: 0 4px 16px rgba(6,214,160,0.4); transform: translateY(-1px); }

  .btn-sm-new {
    background: var(--task-bg);
    color: var(--text-muted);
    border: 2px solid var(--task-border);
  }
  .btn-sm-new:hover { border-color: var(--purple); color: var(--purple); }

  /* ===== NUMBER LINE ===== */
  .numline {
    display: flex;
    align-items: center;
    overflow-x: auto;
    padding: 4px 0 8px;
    scrollbar-width: thin;
  }

  .nl-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }

  .nl-num {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 900;
    color: white;
    flex-shrink: 0;
  }
  .nl-num.nl-boundary { background: var(--purple); width: 34px; height: 34px; font-size: 0.82rem; }
  .nl-num.nl-zero     { background: var(--blue);   width: 34px; height: 34px; font-size: 0.82rem; }
  .nl-num.nl-neg      { background: var(--pink); }
  .nl-num.even        { background: var(--teal); }
  .nl-num.odd         { background: var(--orange); }

  .nl-line {
    flex: 1;
    height: 3px;
    background: linear-gradient(90deg, #E0E0E0, #D0D0D0);
    min-width: 8px;
    flex-shrink: 0;
  }

  /* ===== TASK GRIDS ===== */
  .task-grid {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(3, 1fr);
  }

  @media (max-width: 600px) {
    .task-grid { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 2.2rem; }
    .dark-toggle { position: static; margin-bottom: 10px; }
    .card-actions { gap: 6px; }
  }

  .task-item {
    background: var(--task-bg);
    border: 2.5px solid var(--task-border);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--dark);
    transition: border-color 0.2s, box-shadow 0.2s;
    position: relative;
  }

  .task-item:focus-within {
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(155,93,229,0.12);
  }

  .task-item.correct {
    border-color: var(--green);
    background: var(--icon-green-bg);
    animation: popIn 0.3s ease;
  }

  .task-item.wrong {
    border-color: var(--red);
    background: #FFF0F2;
    animation: shake 0.35s ease;
  }
  [data-theme="dark"] .task-item.wrong { background: #2E0D12; }

  @keyframes popIn {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-5px); }
    75%     { transform: translateX(5px); }
  }

  .task-input {
    width: 52px;
    border: none;
    border-bottom: 3px solid var(--dark);
    background: transparent;
    font-family: 'Nunito', sans-serif;
    font-size: 1.3rem;
    font-weight: 900;
    color: var(--purple);
    outline: none;
    text-align: center;
    padding: 0 2px;
    transition: border-color 0.2s;
  }
  .task-input:focus         { border-color: var(--purple); }
  .task-input.correct       { color: var(--green); border-color: var(--green); }
  .task-input.wrong         { color: var(--red);   border-color: var(--red); }

  .task-feedback {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    font-size: 1.1rem;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .task-item.correct .task-feedback { opacity: 1; }
  .task-item.wrong   .task-feedback { opacity: 1; }

  /* Sign selector */
  .sign-group { display: flex; gap: 6px; align-items: center; }

  .sign-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 2.5px solid var(--task-border);
    background: var(--card);
    font-size: 1.1rem;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    color: var(--text-muted);
  }
  .sign-btn:hover            { border-color: var(--purple); color: var(--purple); }
  .sign-btn.selected-plus    { background: var(--green); border-color: var(--green); color: white; }
  .sign-btn.selected-minus   { background: var(--pink);  border-color: var(--pink);  color: white; }
  .sign-btn.correct-sign     { background: var(--green); border-color: var(--green); color: white; }
  .sign-btn.wrong-sign       { background: var(--red);   border-color: var(--red);   color: white; }

  /* Word problems */
  .word-problem {
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 12px;
    position: relative;
  }
  .word-problem:nth-child(1) { background: var(--word1-bg); border-left: 5px solid var(--yellow); }
  .word-problem:nth-child(2) { background: var(--word2-bg); border-left: 5px solid var(--green); }
  .word-problem:nth-child(3) { background: var(--word3-bg); border-left: 5px solid var(--purple); }
  .word-problem:nth-child(4) { background: var(--word4-bg); border-left: 5px solid var(--pink); }

  .word-text {
    font-size: 1rem;
    font-weight: 700;
    color: var(--dark);
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .word-emoji { font-size: 1.5rem; margin-right: 6px; }

  .word-answer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-muted);
  }

  .word-input {
    width: 60px;
    padding: 4px 8px;
    border: 2.5px solid var(--border);
    border-radius: 8px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    text-align: center;
    color: var(--dark);
    background: var(--card);
    outline: none;
    transition: all 0.2s;
  }
  .word-input:focus   { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(155,93,229,0.1); }
  .word-input.correct { border-color: var(--green); background: var(--icon-green-bg); color: var(--green); }
  .word-input.wrong   { border-color: var(--red);   background: #FFF0F2; color: var(--red); }
  [data-theme="dark"] .word-input.wrong { background: #2E0D12; }

  /* ===== ACTIONS ===== */
  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 50px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:active { transform: scale(0.96); }

  .btn-check {
    background: linear-gradient(135deg, var(--green), var(--teal));
    color: white;
    box-shadow: 0 4px 20px rgba(6,214,160,0.35);
  }
  .btn-check:hover { box-shadow: 0 6px 28px rgba(6,214,160,0.45); transform: translateY(-1px); }

  .btn-new {
    background: linear-gradient(135deg, var(--purple), #C77DFF);
    color: white;
    box-shadow: 0 4px 20px rgba(155,93,229,0.35);
  }
  .btn-new:hover { box-shadow: 0 6px 28px rgba(155,93,229,0.45); transform: translateY(-1px); }

  .btn-reset {
    background: var(--card);
    color: var(--text-muted);
    border: 2.5px solid var(--border);
  }
  .btn-reset:hover { border-color: #CCC; color: var(--dark); }

  /* ===== SCORE PANEL ===== */
  .score-panel {
    background: linear-gradient(135deg, var(--purple), #C77DFF, var(--pink));
    border-radius: 20px;
    padding: 24px 28px;
    color: white;
    display: none;
    animation: slideUp 0.4s ease;
  }
  .score-panel.visible { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .score-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .score-number { font-family: 'Fredoka One', sans-serif; font-size: 3.5rem; line-height: 1; }
  .score-label  { font-size: 0.9rem; opacity: 0.85; font-weight: 700; margin-top: 4px; }
  .score-stars  { font-size: 2rem; letter-spacing: 4px; }
  .score-msg    { font-family: 'Fredoka One', sans-serif; font-size: 1.4rem; line-height: 1.3; }

  .progress-bar-wrap {
    background: rgba(255,255,255,0.2);
    border-radius: 50px;
    height: 10px;
    margin-top: 16px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: white;
    border-radius: 50px;
    transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Confetti */
  .confetti-wrap {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 10px; height: 10px;
    top: -20px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .divider { border: none; border-top: 2px dashed var(--divider); margin: 4px 0; }
</style>
</head>
<body>

<div class="confetti-wrap" id="confettiWrap"></div>

<header class="header">
  <button class="dark-toggle" onclick="toggleDark()" id="darkBtn" title="Téma váltás">🌙</button>
  <div class="header-badge">✏️ 1. Osztály &nbsp;•&nbsp; Matematika</div>
  <h1>Matek Feladatsor</h1>
  <div class="subtitle" id="subtitleEl">Összeadás &amp; Kivonás • 0–20-as számkör</div>
</header>

<div class="info-bar">
  <div class="info-field"><label>Név</label><input type="text" placeholder="Írd ide a neved…"></div>
  <div class="info-field"><label>Dátum</label><input type="text" placeholder="pl. 2025. 03. 15."></div>
  <div class="info-field"><label>Osztály</label><input type="text" placeholder="pl. 1/A"></div>
</div>

<div class="settings-panel">
  <button class="settings-toggle" onclick="toggleSettings()" id="settingsToggleBtn">
    <span>⚙️ Beállítások</span>
    <span id="settingsArrow">▼</span>
  </button>
  <div class="settings-body" id="settingsBody">
    <div class="settings-row">
      <div class="settings-field">
        <label>Minimum szám</label>
        <input type="number" id="settingMin" value="0" step="1">
      </div>
      <div class="settings-field">
        <label>Maximum szám</label>
        <input type="number" id="settingMax" value="20" step="1">
      </div>
      <label class="settings-checkbox">
        <input type="checkbox" id="settingNeg">
        Negatív számok engedélyezése
      </label>
      <button class="settings-apply" onclick="applySettings()">✔ Alkalmaz &amp; Újragenerál</button>
    </div>
  </div>
</div>

<div class="main">

  <!-- Number line -->
  <div class="card">
    <div class="card-accent purple"></div>
    <div class="card-header">
      <div class="card-title"><span class="icon purple">🔢</span> Számegyenes</div>
    </div>
    <div class="numline" id="numLineEl"></div>
  </div>

  <!-- Addition -->
  <div class="card">
    <div class="card-accent green"></div>
    <div class="card-header">
      <div class="card-title"><span class="icon green">➕</span> Összeadás</div>
      <div class="card-actions">
        <span class="card-score" id="add-score"></span>
        <button class="btn-sm btn-sm-check" onclick="checkSection('add')">✅ Ellenőrzés</button>
        <button class="btn-sm btn-sm-new" onclick="regenSection('add')">🎲 Újra</button>
      </div>
    </div>
    <div class="task-grid" id="addGrid"></div>
  </div>

  <!-- Subtraction -->
  <div class="card">
    <div class="card-accent pink"></div>
    <div class="card-header">
      <div class="card-title"><span class="icon pink">➖</span> Kivonás</div>
      <div class="card-actions">
        <span class="card-score" id="sub-score"></span>
        <button class="btn-sm btn-sm-check" onclick="checkSection('sub')">✅ Ellenőrzés</button>
        <button class="btn-sm btn-sm-new" onclick="regenSection('sub')">🎲 Újra</button>
      </div>
    </div>
    <div class="task-grid" id="subGrid"></div>
  </div>

  <!-- Mixed sign -->
  <div class="card">
    <div class="card-accent purple"></div>
    <div class="card-header">
      <div class="card-title"><span class="icon purple">🔀</span> Melyik a jel? &nbsp;<span style="font-size:0.9rem;font-weight:700;color:var(--text-muted)">( + vagy − )</span></div>
      <div class="card-actions">
        <span class="card-score" id="mix-score"></span>
        <button class="btn-sm btn-sm-check" onclick="checkSection('mix')">✅ Ellenőrzés</button>
        <button class="btn-sm btn-sm-new" onclick="regenSection('mix')">🎲 Újra</button>
      </div>
    </div>
    <div class="task-grid" id="mixGrid" style="grid-template-columns: repeat(2, 1fr);"></div>
  </div>

  <!-- Word problems -->
  <div class="card">
    <div class="card-accent yellow"></div>
    <div class="card-header">
      <div class="card-title"><span class="icon yellow">📖</span> Szöveges feladatok</div>
      <div class="card-actions">
        <span class="card-score" id="word-score"></span>
        <button class="btn-sm btn-sm-check" onclick="checkSection('word')">✅ Ellenőrzés</button>
        <button class="btn-sm btn-sm-new" onclick="regenSection('word')">🎲 Újra</button>
      </div>
    </div>
    <div id="wordProblems"></div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-check" onclick="checkAll()">✅ Összes ellenőrzés</button>
    <button class="btn btn-new" onclick="generateAll()">🎲 Új feladatsor</button>
    <button class="btn btn-reset" onclick="resetAll()">🔄 Törlés</button>
  </div>

  <!-- Score -->
  <div class="score-panel" id="scorePanel">
    <div class="score-inner">
      <div>
        <div class="score-number" id="scoreNum">0/0</div>
        <div class="score-label">helyes válasz</div>
      </div>
      <div>
        <div class="score-stars" id="scoreStars">⭐⭐⭐</div>
        <div class="score-msg" id="scoreMsg">Szuper!</div>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
    </div>
  </div>

</div>

<script>
// ===== DARK MODE =====
(function initTheme() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
})();

function toggleDark() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.getElementById('darkBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', next);
}

// Set button icon after DOM ready
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('theme') || 'light';
  document.getElementById('darkBtn').textContent = saved === 'dark' ? '☀️' : '🌙';
});

// ===== SETTINGS =====
let cfg = { min: 0, max: 20, neg: false };

function getMin() { return cfg.neg ? cfg.min : Math.max(0, cfg.min); }
function getMax() { return cfg.max; }

function toggleSettings() {
  const body = document.getElementById('settingsBody');
  const arrow = document.getElementById('settingsArrow');
  body.classList.toggle('open');
  arrow.textContent = body.classList.contains('open') ? '▲' : '▼';
}

function applySettings() {
  const mn = parseInt(document.getElementById('settingMin').value);
  const mx = parseInt(document.getElementById('settingMax').value);
  const neg = document.getElementById('settingNeg').checked;
  if (isNaN(mn) || isNaN(mx) || mn >= mx) {
    alert('A minimum számnak kisebbnek kell lennie a maximumnál!');
    return;
  }
  cfg = { min: mn, max: mx, neg };
  updateSubtitle();
  generateAll();
}

function updateSubtitle() {
  const negStr = cfg.neg ? ' (negatív számokkal)' : '';
  document.getElementById('subtitleEl').textContent =
    `Összeadás & Kivonás • ${cfg.min}–${cfg.max}-es számkör${negStr}`;
}

// ===== DATA =====
let addTasks = [], subTasks = [], mixTasks = [], wordTasks = [];

// Word templates – emoji is stored separately and passed into the generated task
const wordTemplates = [
  { emoji: '🍎', gen: (mn, mx) => {
    const a = rnd(1, Math.min(12, mx)), b = rnd(1, Math.min(8, mx - a));
    return { text: `Pistának van ${a} almája. Kapott még ${b} almát. Hány almája van most összesen?`, answer: a + b, unit: 'alma' };
  }},
  { emoji: '🐦', gen: (mn, mx) => {
    const a = rnd(Math.max(3, mn + 2), mx), b = rnd(1, a - 1);
    return { text: `A fán ült ${a} madár. Elrepült belőlük ${b}. Hány madár maradt a fán?`, answer: a - b, unit: 'madár' };
  }},
  { emoji: '🍬', gen: (mn, mx) => {
    const a = rnd(1, Math.min(10, mx)), b = rnd(1, Math.min(10, mx - a));
    return { text: `Annának volt ${a} cukorkája, Bélának ${b}. Összesen hány cukorka van nekik?`, answer: a + b, unit: 'cukorka' };
  }},
  { emoji: '⚽', gen: (mn, mx) => {
    const a = rnd(Math.max(3, mn + 2), mx), b = rnd(1, a - 1);
    return { text: `A focicsapatban ${a} gyerek volt. Hazament ${b}. Hány gyerek maradt?`, answer: a - b, unit: 'gyerek' };
  }},
  { emoji: '🌸', gen: (mn, mx) => {
    const a = rnd(1, Math.min(10, mx)), b = rnd(1, Math.min(10, mx - a));
    return { text: `Kati ${a} virágot szedett, Móni ${b} virágot. Hány virágot szedtek összesen?`, answer: a + b, unit: 'virág' };
  }},
  { emoji: '🐟', gen: (mn, mx) => {
    const a = rnd(Math.max(4, mn + 2), mx), b = rnd(1, a - 2);
    return { text: `Az akváriumban ${a} hal úszkált. Kivettem ${b} halat. Hány hal maradt?`, answer: a - b, unit: 'hal' };
  }},
  { emoji: '🚗', gen: (mn, mx) => {
    const a = rnd(1, Math.min(10, mx)), b = rnd(1, Math.min(10, mx - a));
    return { text: `A parkolóban ${a} piros és ${b} kék autó állt. Hány autó volt összesen?`, answer: a + b, unit: 'autó' };
  }},
  { emoji: '🍕', gen: (mn, mx) => {
    const a = rnd(Math.max(4, mn + 2), mx), b = rnd(1, a - 1);
    return { text: `A pizzából volt ${a} szelet. Megettük ${b} szeletet. Hány szelet maradt?`, answer: a - b, unit: 'szelet' };
  }},
  { emoji: '🐢', gen: (mn, mx) => {
    const a = rnd(1, Math.min(10, mx)), b = rnd(1, Math.min(10, mx - a));
    return { text: `Az egyik tóban ${a} teknős élt, a másikban ${b}. Összesen hány teknős van?`, answer: a + b, unit: 'teknős' };
  }},
  { emoji: '🎈', gen: (mn, mx) => {
    const a = rnd(Math.max(4, mn + 2), mx), b = rnd(1, a - 2);
    return { text: `Volt ${a} léggömb. Elszállt ${b}. Hány léggömb maradt?`, answer: a - b, unit: 'léggömb' };
  }},
];

function rnd(min, max) {
  if (min > max) [min, max] = [max, min];
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// ===== GENERATORS =====
function genAdd(count = 12) {
  const tasks = [];
  const mn = getMin(), mx = getMax();
  for (let i = 0; i < count; i++) {
    const a = rnd(mn, mx);
    const b = rnd(mn, mx - (a > 0 ? a : 0));
    tasks.push({ a, b, op: '+', answer: a + b });
  }
  return tasks;
}

function genSub(count = 12) {
  const tasks = [];
  const mn = getMin(), mx = getMax();
  for (let i = 0; i < count; i++) {
    let a = rnd(mn, mx);
    let b = rnd(mn, mx);
    if (!cfg.neg && a < b) [a, b] = [b, a]; // ensure non-negative result
    tasks.push({ a, b, op: '−', answer: a - b });
  }
  return tasks;
}

function genMix(count = 6) {
  const tasks = [];
  const mn = getMin(), mx = getMax();
  for (let i = 0; i < count; i++) {
    const isAdd = Math.random() > 0.5;
    let a, b, answer, op;
    if (isAdd) {
      a = rnd(mn, mx);
      b = rnd(mn, mx - (a > 0 ? a : 0));
      answer = a + b; op = '+';
    } else {
      a = rnd(mn, mx); b = rnd(mn, mx);
      if (!cfg.neg && a < b) [a, b] = [b, a];
      answer = a - b; op = '−';
    }
    tasks.push({ a, b, op, answer });
  }
  return tasks;
}

function genWords(count = 4) {
  const mn = Math.max(1, getMin()), mx = getMax();
  const shuffled = [...wordTemplates].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count).map(t => {
    const task = t.gen(mn, mx);
    return { ...task, emoji: t.emoji }; // attach correct emoji to task data
  });
}

// ===== NUMBER LINE =====
function renderNumLine() {
  const mn = cfg.neg ? cfg.min : Math.max(0, cfg.min);
  const mx = cfg.max;
  const el = document.getElementById('numLineEl');
  let html = '';
  for (let n = mn; n <= mx; n++) {
    let cls;
    if (n === mn || n === mx) cls = 'nl-boundary';
    else if (n === 0)         cls = 'nl-zero';
    else if (n < 0)           cls = 'nl-neg';
    else if (n % 2 === 0)     cls = 'even';
    else                      cls = 'odd';
    html += `<div class="nl-item"><div class="nl-num ${cls}">${n}</div></div>`;
    if (n < mx) html += '<div class="nl-line"></div>';
  }
  el.innerHTML = html;
}

// ===== RENDER =====
function renderAdd() {
  document.getElementById('addGrid').innerHTML = addTasks.map((t, i) => `
    <div class="task-item" id="add-${i}">
      ${t.a} + ${t.b} =
      <input class="task-input" type="number" id="add-inp-${i}" placeholder="?" onkeydown="handleEnter(event,'add-inp-${i+1}')">
      <span class="task-feedback" id="add-fb-${i}"></span>
    </div>`).join('');
  clearScore('add');
}

function renderSub() {
  document.getElementById('subGrid').innerHTML = subTasks.map((t, i) => `
    <div class="task-item" id="sub-${i}">
      ${t.a} − ${t.b} =
      <input class="task-input" type="number" id="sub-inp-${i}" placeholder="?" onkeydown="handleEnter(event,'sub-inp-${i+1}')">
      <span class="task-feedback" id="sub-fb-${i}"></span>
    </div>`).join('');
  clearScore('sub');
}

function renderMix() {
  document.getElementById('mixGrid').innerHTML = mixTasks.map((t, i) => {
    const result = t.op === '+' ? t.a + t.b : t.a - t.b;
    return `
    <div class="task-item" id="mix-${i}">
      <span style="font-size:1.3rem;font-weight:900;">${t.a}</span>
      <div class="sign-group">
        <button class="sign-btn" id="mix-plus-${i}" onclick="selectSign(${i}, '+')" title="+">+</button>
        <button class="sign-btn" id="mix-minus-${i}" onclick="selectSign(${i}, '−')" title="−">−</button>
      </div>
      <span style="font-size:1.3rem;font-weight:900;">${t.b} = ${result}</span>
      <span class="task-feedback" id="mix-fb-${i}"></span>
    </div>`;
  }).join('');
  clearScore('mix');
}

function renderWords() {
  document.getElementById('wordProblems').innerHTML = wordTasks.map((t, i) => `
    <div class="word-problem" id="word-${i}">
      <div class="word-text"><span class="word-emoji">${t.emoji}</span>${t.text}</div>
      <div class="word-answer-row">
        Válasz:
        <input class="word-input" type="number" id="word-inp-${i}" placeholder="?">
        <span id="word-unit-${i}">${t.unit}</span>
        <span id="word-fb-${i}" style="font-size:1.1rem"></span>
      </div>
    </div>`).join('');
  clearScore('word');
}

function selectSign(i, sign) {
  document.getElementById(`mix-plus-${i}`).className  = 'sign-btn' + (sign === '+' ? ' selected-plus' : '');
  document.getElementById(`mix-minus-${i}`).className = 'sign-btn' + (sign === '−' ? ' selected-minus' : '');
  mixTasks[i].selected = sign;
  document.getElementById(`mix-fb-${i}`).textContent = '';
  document.getElementById(`mix-${i}`).classList.remove('correct', 'wrong');
}

// ===== SCORE HELPERS =====
function clearScore(section) {
  const el = document.getElementById(`${section}-score`);
  if (el) { el.textContent = ''; el.className = 'card-score'; }
}

function showSectionScore(section, correct, total) {
  const el = document.getElementById(`${section}-score`);
  if (!el || total === 0) return;
  el.textContent = `${correct}/${total}`;
  el.className = 'card-score ' + (correct === total ? 'all-correct' : 'some-wrong');
}

// ===== SECTION CHECK =====
function checkSection(section) {
  let correct = 0, total = 0;

  if (section === 'add') {
    addTasks.forEach((t, i) => {
      const inp = document.getElementById(`add-inp-${i}`);
      const box = document.getElementById(`add-${i}`);
      const fb  = document.getElementById(`add-fb-${i}`);
      if (inp.value === '') return;
      total++;
      const ok = parseInt(inp.value) === t.answer;
      box.classList.toggle('correct', ok); box.classList.toggle('wrong', !ok);
      inp.classList.toggle('correct', ok); inp.classList.toggle('wrong', !ok);
      fb.textContent = ok ? '✅' : '❌';
      if (ok) correct++;
    });
  }

  if (section === 'sub') {
    subTasks.forEach((t, i) => {
      const inp = document.getElementById(`sub-inp-${i}`);
      const box = document.getElementById(`sub-${i}`);
      const fb  = document.getElementById(`sub-fb-${i}`);
      if (inp.value === '') return;
      total++;
      const ok = parseInt(inp.value) === t.answer;
      box.classList.toggle('correct', ok); box.classList.toggle('wrong', !ok);
      inp.classList.toggle('correct', ok); inp.classList.toggle('wrong', !ok);
      fb.textContent = ok ? '✅' : '❌';
      if (ok) correct++;
    });
  }

  if (section === 'mix') {
    mixTasks.forEach((t, i) => {
      if (!t.selected) return;
      total++;
      const ok = t.selected === t.op;
      const box = document.getElementById(`mix-${i}`);
      const fb  = document.getElementById(`mix-fb-${i}`);
      const plusBtn  = document.getElementById(`mix-plus-${i}`);
      const minusBtn = document.getElementById(`mix-minus-${i}`);
      box.classList.toggle('correct', ok); box.classList.toggle('wrong', !ok);
      fb.textContent = ok ? '✅' : '❌';
      if (ok) {
        correct++;
        if (t.op === '+') plusBtn.className = 'sign-btn correct-sign';
        else minusBtn.className = 'sign-btn correct-sign';
      } else {
        if (t.selected === '+') plusBtn.className = 'sign-btn wrong-sign';
        else minusBtn.className = 'sign-btn wrong-sign';
      }
    });
  }

  if (section === 'word') {
    wordTasks.forEach((t, i) => {
      const inp = document.getElementById(`word-inp-${i}`);
      const fb  = document.getElementById(`word-fb-${i}`);
      if (inp.value === '') return;
      total++;
      const ok = parseInt(inp.value) === t.answer;
      inp.classList.toggle('correct', ok); inp.classList.toggle('wrong', !ok);
      fb.textContent = ok ? '✅' : '❌';
      if (ok) correct++;
    });
  }

  showSectionScore(section, correct, total);
}

// ===== SECTION REGEN =====
function regenSection(section) {
  if (section === 'add')  { addTasks  = genAdd(12);  renderAdd(); }
  if (section === 'sub')  { subTasks  = genSub(12);  renderSub(); }
  if (section === 'mix')  { mixTasks  = genMix(6);   renderMix(); }
  if (section === 'word') { wordTasks = genWords(4); renderWords(); }
  document.getElementById('scorePanel').classList.remove('visible');
}

// ===== MAIN GENERATE =====
function generateAll() {
  addTasks  = genAdd(12);
  subTasks  = genSub(12);
  mixTasks  = genMix(6);
  wordTasks = genWords(4);
  renderAdd(); renderSub(); renderMix(); renderWords(); renderNumLine();
  document.getElementById('scorePanel').classList.remove('visible');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== CHECK ALL =====
function checkAll() {
  ['add','sub','mix','word'].forEach(checkSection);

  let correct = 0, answered = 0;
  addTasks.forEach((t, i) => {
    const v = document.getElementById(`add-inp-${i}`).value;
    if (v === '') return; answered++;
    if (parseInt(v) === t.answer) correct++;
  });
  subTasks.forEach((t, i) => {
    const v = document.getElementById(`sub-inp-${i}`).value;
    if (v === '') return; answered++;
    if (parseInt(v) === t.answer) correct++;
  });
  mixTasks.forEach(t => {
    if (!t.selected) return; answered++;
    if (t.selected === t.op) correct++;
  });
  wordTasks.forEach((t, i) => {
    const v = document.getElementById(`word-inp-${i}`).value;
    if (v === '') return; answered++;
    if (parseInt(v) === t.answer) correct++;
  });

  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('scoreNum').textContent = `${correct} / ${answered}`;
  setTimeout(() => { document.getElementById('progressFill').style.width = pct + '%'; }, 100);

  let stars = '⭐', msg = 'Próbáld újra! 💪';
  if (pct >= 90)      { stars = '⭐⭐⭐'; msg = 'Fantasztikus! 🎉'; }
  else if (pct >= 70) { stars = '⭐⭐';   msg = 'Nagyon jó! 👏'; }
  else if (pct >= 50) { stars = '⭐';     msg = 'Jó munka! 😊'; }

  document.getElementById('scoreStars').textContent = stars;
  document.getElementById('scoreMsg').textContent   = msg;
  const panel = document.getElementById('scorePanel');
  panel.classList.add('visible');
  if (pct >= 90 && answered >= 10) launchConfetti();
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ===== RESET =====
function resetAll() {
  document.querySelectorAll('.task-input, .word-input').forEach(inp => {
    inp.value = '';
    inp.classList.remove('correct','wrong');
  });
  document.querySelectorAll('.task-item, .word-problem').forEach(el => el.classList.remove('correct','wrong'));
  document.querySelectorAll('.task-feedback, [id^="word-fb-"]').forEach(fb => fb.textContent = '');
  document.querySelectorAll('.sign-btn').forEach(btn => btn.className = 'sign-btn');
  mixTasks.forEach(t => delete t.selected);
  document.getElementById('scorePanel').classList.remove('visible');
  ['add','sub','mix','word'].forEach(clearScore);
}

// ===== CONFETTI =====
function launchConfetti() {
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const colors = ['#FFD93D','#FF6B35','#4CC9F0','#06D6A0','#FF6B9D','#9B5DE5','#4ECDC4'];
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};`
      + `width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;`
      + `border-radius:${Math.random()>.5?'50%':'2px'};`
      + `animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(() => { wrap.innerHTML = ''; }, 4000);
}

// ===== ENTER KEY =====
function handleEnter(e, nextId) {
  if (e.key === 'Enter') { const n = document.getElementById(nextId); if (n) n.focus(); }
}

// ===== INIT =====
generateAll();
</script>
